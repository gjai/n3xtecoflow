name: Ingest news (all themes)

on:
  schedule:
    # Every 4 hours — fair per-theme ingest (incl. casinos-crypto)
    - cron: "20 */4 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production news ingest (per theme)
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
          SITE_URL: https://ecoflow-stream.com
        run: |
          set -euo pipefail
          if [ -z "$NEWS_CRON_SECRET" ]; then
            echo "NEWS_CRON_SECRET missing"
            exit 1
          fi
          # Sequential: shared news.json must not be written in parallel.
          # limit=2 per theme keeps AI rewrite under maxDuration;
          # euromillions takes 4 so the lottery index can fill.
          fail=0
          for site in ecoflow tumbler massage-gun casinos-crypto euromillions; do
            limit=2
            if [ "${site}" = "euromillions" ]; then
              limit=4
            fi
            echo "=== ingest siteId=${site} limit=${limit} ==="
            if ! curl -fsS -X POST \
              -H "Authorization: Bearer ${NEWS_CRON_SECRET}" \
              "${SITE_URL}/api/news/ingest?siteId=${site}&limit=${limit}"; then
              echo "FAILED: ${site}"
              fail=1
            fi
            echo
          done
          exit "${fail}"
      - name: Alert on failure
        if: failure()
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
          SITE_URL: https://ecoflow-stream.com
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${NEWS_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"job\":\"news\",\"workflow\":\"${{ github.workflow }}\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"error\":\"workflow_failed\"}" \
            "${SITE_URL}/api/cron/alert" || true
