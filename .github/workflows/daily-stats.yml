name: Daily site stats email

on:
  schedule:
    # 12:00 Europe/Paris (CEST = UTC+2). In winter (CET) this is 11:00 local.
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily stats digest
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
          SITE_URL: https://ecoflow-stream.com
        run: |
          if [ -z "$NEWS_CRON_SECRET" ]; then
            echo "NEWS_CRON_SECRET missing"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${NEWS_CRON_SECRET}" \
            "${SITE_URL}/api/stats/daily"
      - name: Alert on failure
        if: failure()
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
          SITE_URL: https://ecoflow-stream.com
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${NEWS_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"job\":\"stats\",\"workflow\":\"${{ github.workflow }}\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"error\":\"workflow_failed\"}" \
            "${SITE_URL}/api/cron/alert" || true
