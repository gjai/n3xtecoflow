name: EuroMillions draws refresh

on:
  schedule:
    # After typical draw windows (UTC): Tue/Fri ~21:00 CET = 20:00 UTC winter / 19:00 summer
    - cron: "15 20 * * 2,5"
    - cron: "45 21 * * 2,5"
    # Daily safety net (archives + next jackpot)
    - cron: "30 7 * * *"
    # Other FDJ games: Loto (Mon/Wed/Sat ~20:55), EuroDreams (Mon/Thu ~21:00),
    # Keno / Crescendo several times a day — don't wait on EuroMillions nights.
    - cron: "10 19 * * *"
    - cron: "20 21 * * 1,3,4,6"
    # Live FDJ-only: every 10 min around Keno midi + evening draws (covers CET/CEST)
    - cron: "*/10 11-13 * * *"
    - cron: "*/10 18-22 * * *"
    # Serré 20h50–21h40 Paris mar/ven (CEST 18:50–19:40 UTC, CET 19:50–20:40 UTC)
    - cron: "*/2 18-20 * * 2,5"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FAST_LIVE: ${{ github.event_name == 'schedule' && (contains(github.event.schedule, '*/10') || contains(github.event.schedule, '*/2')) }}
    steps:
      - name: Fast live refresh (draw windows)
        if: env.FAST_LIVE == 'true'
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
          SITE_URL: https://euromillions-resultats.fr
        run: |
          set -euo pipefail
          if [ -z "$NEWS_CRON_SECRET" ]; then
            echo "NEWS_CRON_SECRET missing"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${NEWS_CRON_SECRET}" \
            "${SITE_URL}/api/euromillions/refresh?mode=fast"
      - name: Refresh EuroMillions draws (full)
        if: github.event_name == 'workflow_dispatch' || env.FAST_LIVE != 'true'
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
          SITE_URL: https://euromillions-resultats.fr
        run: |
          set -euo pipefail
          if [ -z "$NEWS_CRON_SECRET" ]; then
            echo "NEWS_CRON_SECRET missing"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${NEWS_CRON_SECRET}" \
            "${SITE_URL}/api/euromillions/refresh"
      - name: Refresh other FDJ games (Loto, EuroDreams, Keno, Crescendo)
        if: github.event_name == 'workflow_dispatch' || env.FAST_LIVE != 'true'
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
          SITE_URL: https://euromillions-resultats.fr
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${NEWS_CRON_SECRET}" \
            "${SITE_URL}/api/fdj-games/refresh"
      - name: Ingest EuroMillions news
        if: github.event_name == 'workflow_dispatch' || env.FAST_LIVE != 'true'
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
          SITE_URL: https://euromillions-resultats.fr
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${NEWS_CRON_SECRET}" \
            "${SITE_URL}/api/news/ingest?siteId=euromillions&limit=4"
      - name: Alert on failure
        if: failure()
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
          SITE_URL: https://ecoflow-stream.com
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${NEWS_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"job\":\"euromillions\",\"workflow\":\"${{ github.workflow }}\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"error\":\"workflow_failed\"}" \
            "${SITE_URL}/api/cron/alert" || true
